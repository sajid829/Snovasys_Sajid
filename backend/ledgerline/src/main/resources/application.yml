spring:
  application:
    name: ledgerline
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerline_db}
    username: ${DB_USERNAME:ledgerline_app}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ledgerline
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
